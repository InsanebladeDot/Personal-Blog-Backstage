# ===== 应用 =====
spring.application.name=Personal_Blog_Backstage

# RSA 传输加密密钥对持久化目录（首次启动生成，重启复用；容器部署建议挂载卷）
rsa.key-path=./rsa-keys

# ===== 数据源 =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
server.port=8080

# ===== 上传 =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

logging.level.org.springframework.jdbc.support.jdbcTransactionManager=debug
upload.path=/var/audio-uploads
mybatis.mapper-locations=classpath:mapper/*.xml

# ===== 腾讯云 COS =====
tencent.cos.region=${COS_REGION}
tencent.cos.bucket=${COS_BUCKET}
tencent.cos.secretId=${COS_SECRET_ID}
tencent.cos.secretKey=${COS_SECRET_KEY}

# ===== Gitee OAuth =====
client_id=${GITEE_CLIENT_ID}
client_secret=${GITEE_CLIENT_SECRET}
redirect_uri=${GITEE_REDIRECT_URI}

gitee.client_id=${GITEE_CLIENT_ID}
gitee.client_secret=${GITEE_CLIENT_SECRET}
gitee.redirectURI=${GITEE_REDIRECT_URI}
gitee.homeURI=${GITEE_HOME_URI}
gitee.authorizeURL=https://gitee.com/oauth/authorize
gitee.accessToken=https://gitee.com/oauth/token
gitee.userInfo=https://gitee.com/api/v5/user

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# ===== Redisson =====
spring.redis.redisson.config=classpath:redisson-single-node.yml
